name: WINAKPlugin
description: Een plugin voor de WINAK Minecraft server.
prefix: WINAK
version: '${version}'

main: be.kyanvde.winakplugin.WINAKPlugin
api-version: '26.3'
load: POSTWORLD

authors: [ Kyan Van den Eynde ]
website: https://winak.be/

commands:
  pee:
    description: Start or stop peeing.
    usage: /<command>
    permission: winak.pee

permissions:
  winak.pee:
    description: Allows using /pee.
    default: true
